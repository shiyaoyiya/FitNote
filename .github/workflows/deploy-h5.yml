name: Deploy H5 Demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 推送到 gh-pages 分支需要 contents: write
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build H5
        run: npm run build:h5 2>&1 | tee /tmp/build-h5.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-h5-log
          path: /tmp/build-h5.log

      # 将构建产物推送到 gh-pages 分支，由 GitHub Pages（分支源模式）自动发布
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist/build/h5
          publish_branch: gh-pages
          force_orphan: true
