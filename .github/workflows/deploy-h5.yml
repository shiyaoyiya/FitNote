name: Deploy H5 Demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# 推送到 gh-pages 分支需要 contents: write
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个部署任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build H5
        run: npm run build:h5 2>&1 | tee /tmp/build-h5.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-h5-log
          path: /tmp/build-h5.log

      # 将构建产物推送到 gh-pages 分支，由 GitHub Pages（分支源模式）自动发布
      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          (
            set -e
            cd dist/build/h5
            git init -b gh-pages
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Deploy $(date +'%Y-%m-%d %H:%M:%S')"
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push -f origin gh-pages
          ) > /tmp/deploy.log 2>&1
          code=$?
          cat /tmp/deploy.log
          exit $code

      - name: Upload deploy log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-h5-log
          path: /tmp/deploy.log
